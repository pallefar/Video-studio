# Infrastructure only: postgres, redis, minio.
# The GPU worker runs natively in a venv (see CLAUDE.md) — never containerise it locally.
#
# Security: every port is bound to 127.0.0.1 — these services carry default
# dev credentials and no TLS, so they must never be reachable from the LAN.
# A rented-GPU worker reaches them over Tailscale/WireGuard (pipeline-spec
# §7), not by opening these ports.
#
# Host ports are env-overridable (POSTGRES_PORT, REDIS_PORT, MINIO_PORT,
# MINIO_CONSOLE_PORT — compose reads .env) so the stack coexists with an
# already-running Postgres/Redis; scripts/setup.sh picks free ports
# automatically and keeps DATABASE_URL/REDIS_URL/S3_ENDPOINT in sync.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: avatar
      POSTGRES_DB: avatar
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
