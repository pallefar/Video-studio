[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-pipeline"
version = "0.1.0"
description = "Self-hosted AI avatar video pipeline (script -> compliant 1080p YouTube video)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.34",
    "redis>=5.0",
    "rq>=1.16",
    "uvicorn>=0.30",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5,<6",
    "psycopg[binary]>=3.1",
]
# Real sentence embeddings for the asset resolver (CPU); without it the
# deterministic hashing embedder is used.
embed = [
    "sentence-transformers>=3.0",
]
# GPU deps install only on the 3090 host: pip install -e ".[gpu]"
# Never imported at module top level outside lazily-guarded paths.
gpu = [
    "torch>=2.3",
]

[tool.setuptools]
packages = [
    "schema",
    "pipeline_core",
    "api",
    "api.routes",
    "api.validators",
    "worker_gpu",
    "worker_gpu.engines",
    "worker_gpu.preprocess",
    "worker_cpu",
    "worker_cpu.ffmpeg",
]

[tool.setuptools.package-dir]
schema = "packages/schema"
pipeline_core = "packages/pipeline_core"
api = "api"
worker_gpu = "worker_gpu"
worker_cpu = "worker_cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]
addopts = "-q"
