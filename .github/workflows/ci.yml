name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (includes M1 acceptance and compliance gate)
        run: pytest
      - name: TS type drift gate — a schema change that isn't re-exported fails here
        run: |
          python packages/schema/export_ts.py
          git diff --exit-code -- web/src/types/schema.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avatar
          POSTGRES_PASSWORD: avatar
          POSTGRES_DB: avatar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avatar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://avatar:avatar@localhost:5432/avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run migrations against real Postgres
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
