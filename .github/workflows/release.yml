name: Release

# One release per big milestone: push a v* tag and this packages the
# macOS + Windows bundles (prebuilt panel included — no Node needed by
# users) and publishes a GitHub Release with notes from the milestone log.
#
#   git tag v0.29.0 && git push origin v0.29.0
#
# Or run it manually (Actions -> Release -> Run workflow) with the version
# input — the release step then creates the tag at the chosen ref itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.29.0"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the control panel
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package platform bundles
        run: bash scripts/make_release.sh "${VERSION}"

      - name: Release notes from the milestone log
        run: python3 scripts/release_notes.py > dist-release/NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Video Studio ${{ inputs.version || github.ref_name }}
          body_path: dist-release/NOTES.md
          files: |
            dist-release/*.zip
            dist-release/SHA256SUMS.txt
